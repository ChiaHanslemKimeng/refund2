<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f2fe" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Hex-Shield Cyber Emblem -->
  <g transform="translate(15, 12)">
    <!-- Hexagon Outer Glow Border -->
    <polygon points="48,4 88,27 88,73 48,96 8,73 8,27" fill="url(#shieldBg)" stroke="url(#cyberGrad)" stroke-width="3.5" filter="url(#glow)"/>
    
    <!-- Inner Cyber Circuit Nodes -->
    <polygon points="48,15 78,32 78,68 48,85 18,68 18,32" fill="none" stroke="rgba(6,182,212,0.3)" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <!-- Central N-Shield Kinetic Pulse -->
    <!-- Stylized Futuristic 'N' Glyph -->
    <path d="M 33 68 L 33 32 L 63 68 L 63 32" fill="none" stroke="url(#cyberGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Data Node Dots -->
    <circle cx="33" cy="32" r="4" fill="#00f2fe" />
    <circle cx="63" cy="68" r="4" fill="#10b981" />
    <circle cx="48" cy="50" r="3" fill="#38bdf8" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(125, 0)">
    <!-- NEXIS in bold futuristic tracking -->
    <text x="0" y="58" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="40" font-weight="900" letter-spacing="5" fill="#f8fafc">
      NEXIS
    </text>
    
    <!-- CYBER RECOVERY in neon emerald/cyan badge text -->
    <text x="2" y="84" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="url(#neonGlow)">
      CYBER RECOVERY
    </text>
    
    <!-- Precision Grid Dot indicator -->
    <circle cx="265" cy="48" r="4" fill="#10b981" />
  </g>
</svg>
