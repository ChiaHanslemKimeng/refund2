<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="shieldBgIcon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00f2fe" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Hexagon -->
  <polygon points="50,4 92,28 92,72 50,96 8,72 8,28" fill="url(#shieldBgIcon)" stroke="url(#cyberGradIcon)" stroke-width="4" filter="url(#glowIcon)"/>
  
  <!-- Circuit Inset -->
  <polygon points="50,14 80,31 80,69 50,86 20,69 20,31" fill="none" stroke="rgba(6,182,212,0.35)" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Futuristic N -->
  <path d="M 34 68 L 34 32 L 66 68 L 66 32" fill="none" stroke="url(#cyberGradIcon)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Node Lights -->
  <circle cx="34" cy="32" r="4.5" fill="#00f2fe" />
  <circle cx="66" cy="68" r="4.5" fill="#10b981" />
  <circle cx="50" cy="50" r="3.5" fill="#38bdf8" />
</svg>
